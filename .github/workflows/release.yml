name: Build Windows x64 (Tauri)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 Installer
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Frontend
        run: npm run build:vite

      - name: Build Tauri Windows x64 Application
        run: npx @tauri-apps/cli build
        env:
          CI: true

      - name: Copy & Rename Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release" -Force
          Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" | Copy-Item -Destination "release/" -Force
          Get-ChildItem -Path "src-tauri/target/release/cherry-selection-lite.exe" | Copy-Item -Destination "release/Cherry-Selection-Lite-Portable.exe" -Force
          Get-ChildItem -Path "release"

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Cherry-Selection-Lite-Windows-x64
          path: |
            release/*.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
